<!DOCTYPE html>
{% assign locale = site.data.locales[page.lang] | default: site.data.locales['zh-TW'] %}
<html lang="{{ locale.html_lang | default: 'zh-Hant-TW' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="shortcut icon" href="{{ '/assets/images/favicon.ico' | relative_url }}">
  <!-- Google Fonts: Lobster (cover year) + Montserrat (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:300,400,500,700|Lobster">
  {% if page.lang == 'ja' %}
  <!-- Noto Sans JP for Japanese glyphs -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap">
  {% endif %}
  <!-- hreflang alternate links -->
  <link rel="alternate" hreflang="zh-Hant-TW" href="{{ '/' | absolute_url }}">
  <link rel="alternate" hreflang="en" href="{{ '/en/' | absolute_url }}">
  <link rel="alternate" hreflang="ja" href="{{ '/ja/' | absolute_url }}">
  <!-- Font Awesome 4.7 (cover social icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <!-- Tailwind CSS (generated by Jekyll plugin) -->
  <link rel="stylesheet" href="{{ '/assets/css/tailwind.css' | relative_url }}">
  <!-- Cover section styles -->
  {% include cover-styles.html %}
  <!-- QR Code generator -->
  <script src="{{ '/assets/js/qrcode.min.js' | relative_url }}"></script>
  <!-- Ruby WASM UMD bundle (local asset) -->
  <script src="{{ '/assets/ruby-wasm/browser.umd.js' | relative_url }}"></script>
</head>
<body style="margin: 0; font-family: {% if page.lang == 'ja' %}'Noto Sans JP', {% endif %}Montserrat, sans-serif;">
  <!-- Language Switcher -->
  <nav style="position: fixed; top: 12px; right: 16px; z-index: 9999; display: flex; gap: 4px; align-items: center; font-size: 12px; font-family: Montserrat, sans-serif; background: rgba(255,255,255,0.92); border: 1px solid #e8d5d3; border-radius: 20px; padding: 4px 10px; box-shadow: 0 2px 8px rgba(50,50,50,0.10);">
    <a href="{{ '/' | relative_url }}" style="color: {% if page.lang == 'zh-TW' or page.lang == nil %}#bd3f32{% else %}#9b9b9b{% endif %}; text-decoration: none; font-weight: {% if page.lang == 'zh-TW' or page.lang == nil %}700{% else %}400{% endif %}; padding: 2px 4px;">中文</a>
    <span style="color: #e8d5d3;">|</span>
    <a href="{{ '/en/' | relative_url }}" style="color: {% if page.lang == 'en' %}#bd3f32{% else %}#9b9b9b{% endif %}; text-decoration: none; font-weight: {% if page.lang == 'en' %}700{% else %}400{% endif %}; padding: 2px 4px;">EN</a>
    <span style="color: #e8d5d3;">|</span>
    <a href="{{ '/ja/' | relative_url }}" style="color: {% if page.lang == 'ja' %}#bd3f32{% else %}#9b9b9b{% endif %}; text-decoration: none; font-weight: {% if page.lang == 'ja' %}700{% else %}400{% endif %}; padding: 2px 4px;">JA</a>
  </nav>
  {{ content }}
</body>
</html>
