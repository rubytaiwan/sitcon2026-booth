# Task 1: Sort
- category: 配列操作
  difficulty: easy
  secret_type: array
  array_length: 5
  element_range: [1, 20]
  question: "整列！secret を小さい順に並べてください。"
  answer: ".sort"
  tips:
    - { code: "[3,1,2].sort", desc: "昇順ソート" }
    - { code: "[3,1,2].sort.reverse", desc: "降順ソート" }
    - { code: "[3,1,2].min", desc: "最小値" }
    - { code: "[3,1,2].max", desc: "最大値" }

