# Task 1: Sort
- category: Array Operations
  difficulty: easy
  secret_type: array
  array_length: 5
  element_range: [1, 20]
  question: "Get your act together! Sort secret from smallest to largest."
  answer: ".sort"
  tips:
    - { code: "[3,1,2].sort", desc: "Sort ascending" }
    - { code: "[3,1,2].sort.reverse", desc: "Sort descending" }
    - { code: "[3,1,2].min", desc: "Minimum value" }
    - { code: "[3,1,2].max", desc: "Maximum value" }

